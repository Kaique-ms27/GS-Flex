# ============================================================
# Sales Express - PRODUÇÃO (Oracle Cloud + Supabase)
# Ativado com SPRING_PROFILES_ACTIVE=prod (já configurado no
# docker-compose.prod.yml).
#
# Sem valor padrão de propósito: se faltar alguma variável no .env,
# a aplicação NÃO sobe (melhor do que subir com senha fraca).
# ============================================================

# ---------- Banco (Supabase) ----------
# Use a connection string do POOLER em modo SESSION (porta 5432).
# Exemplo:
# DB_URL=jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
# DB_USER=postgres.xxxxxxxxxxxxxxxxxxxx
# DB_PASSWORD=sua_senha
# (usuário e senha ficam separados da URL para não precisar codificar
#  caracteres especiais da senha)
# Se usar o modo TRANSACTION (porta 6543), acrescente &prepareThreshold=0 na URL.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Pool pequeno: o plano grátis do Supabase limita as conexões.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1500000

# ---------- Cookie de login (HTTPS via Caddy) ----------
server.servlet.session.cookie.secure=true
# O Caddy termina o HTTPS e repassa o cabeçalho X-Forwarded-*.
server.forward-headers-strategy=framework

# ---------- Administrador inicial (obrigatório definir no .env) ----------
app.admin.usuario=${ADMIN_USUARIO}
app.admin.senha=${ADMIN_SENHA}

# ---------- Menos ruído nos logs ----------
spring.jpa.show-sql=false
logging.level.root=INFO
