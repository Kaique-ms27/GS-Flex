# ============================================================
# Sales Express - configuração base (vale para DESENVOLVIMENTO)
# Em produção o perfil "prod" (application-prod.properties) sobrescreve
# o que for necessário. Tudo pode ser trocado por variáveis de ambiente.
# ============================================================

spring.application.name=salesexpress

# -----------------------------------------------------------------------------
# Configurações do Hibernate / JPA
# -----------------------------------------------------------------------------
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ---------- Banco de dados ----------
# Padrão = PostgreSQL local do docker-compose.yml (banco "pedidos")
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pedidos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---------- Sessão / cookie de login ----------
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Em desenvolvimento (http://localhost) o cookie "secure" não funciona.
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---------- Usuário administrador inicial ----------
# Só é usado no PRIMEIRO start, quando a tabela "usuario" está vazia.
app.admin.usuario=${ADMIN_USUARIO:admin}
app.admin.senha=${ADMIN_SENHA:admin123}